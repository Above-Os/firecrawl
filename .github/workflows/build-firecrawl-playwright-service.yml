name: Build firecrawl-playwright-service Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag to push (e.g. v1.2.3). Leave empty to skip.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/beclab/firecrawl-playwright-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/playwright-service-ts
          file: ./apps/playwright-service-ts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # Dockerfile declares `ARG PORT` with no default; EXPOSE ${PORT}
          # would otherwise fail at build time.
          build-args: |
            PORT=3000
          cache-from: type=gha,scope=firecrawl-playwright-service
          cache-to: type=gha,mode=max,scope=firecrawl-playwright-service
